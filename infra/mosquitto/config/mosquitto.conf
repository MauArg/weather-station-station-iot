# Mosquitto 2.x — Weather Station MQTT Broker

# ─── Listener ────────────────────────────────────────────────────────────────
listener 1883

# ─── Autenticación ───────────────────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd

# ─── Persistencia ────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ─────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
# log_type information   # descomentar para debug detallado
