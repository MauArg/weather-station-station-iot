; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = production

; Credentials outside the repo. `secrets.ini` is in .gitignore; the
; versioned template is `secrets.ini.example`. That's where the firmware's
; -D flags and the OTA upload's --auth come from, so the OTA password lives
; in ONE single place (it used to be duplicated here and in config.h, with a
; comment asking that they not drift out of sync).
extra_configs = secrets.ini

; ─── Shared base ──────────────────────────────────────────────────────────────
[env:base]
platform     = espressif32
board        = esp32-c3-devkitm-1
framework    = arduino
lib_ldf_mode = deep+
upload_speed = 921600

board_build.partitions = partitions_ota.csv

; Each flag is wrapped in single quotes because the SSID can have spaces:
; without that, `Ire y Mau IoT` splits into four arguments and the build fails.
build_flags =
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DMQTT_USER="${secrets.mqtt_user}"'
    '-DMQTT_PASSWORD="${secrets.mqtt_password}"'
    '-DOTA_PASSWORD="${secrets.ota_password}"'

lib_deps =
    knolleary/PubSubClient             @ ^2.8
    adafruit/Adafruit BMP085 Library   @ ^1.2.4
    adafruit/Adafruit SHT31 Library    @ ^2.2.2
    bblanchon/ArduinoJson              @ ^7.0.0
    adafruit/Adafruit Unified Sensor   @ ^1.1.15
    adafruit/Adafruit INA219           @ ^1.2.1
    paulstoffregen/OneWire             @ ^2.3.8
    milesburton/DallasTemperature      @ ^3.11.0
    adafruit/DHT sensor library        @ ^1.4.6

monitor_speed  = 115200
monitor_filters =
    time
    esp32_exception_decoder

; ─── Production (no logs, minimal size) ───────────────────────────────────────
[env:production]
extends = env:base
; `extends` OVERWRITES build_flags, it doesn't accumulate: without the first
; line, env:base's credentials would be lost and the build would fail on
; config.h's #error.
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_VERSION=\"1.16.0\"
    -DLOG_LEVEL=0

; ─── Development (verbose logs, OTA upload possible) ──────────────────────────
[env:development]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_VERSION=\"1.16.0-dev\"
    -DLOG_LEVEL=2

; ─── OTA upload (used from service mode) ──────────────────────────────────────
; Two explicit environments on purpose. There used to be a single
; `ota_upload` that extended `env:development`, so every OTA deploy shipped
; the debug build without anyone noticing — with LOG_LEVEL=2 setup() burns a
; fixed 2s in `delay(2000)` on every wake, on top of the DHT22 warmup. The
; telemetry's `firmware` field is what gives away which one is running.

; Real deploy to the field. This is the one to use unless you're debugging.
[env:ota_production]
extends = env:production
upload_protocol  = espota
upload_port      = weather-station-01.local  ; or direct IP, e.g. 192.168.18.105
upload_flags     = --auth=${secrets.ota_password}

; Debug via OTA: verbose logs, but pays the 2s delay every cycle.
; Don't leave it in the field longer than necessary.
[env:ota_development]
extends = env:development
upload_protocol  = espota
upload_port      = weather-station-01.local  ; or direct IP, e.g. 192.168.18.105
upload_flags     = --auth=${secrets.ota_password}