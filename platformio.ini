; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = production

; Credenciales fuera del repo. `secrets.ini` está en .gitignore; la plantilla
; versionada es `secrets.ini.example`. De ahí salen los -D del firmware y el
; --auth del upload por OTA, así que la password de OTA vive en UN solo lugar
; (antes estaba duplicada acá y en config.h, con un comentario pidiendo que no
; se desincronizaran).
extra_configs = secrets.ini

; ─── Base compartida ──────────────────────────────────────────────────────────
[env:base]
platform     = espressif32
board        = esp32-c3-devkitm-1
framework    = arduino
lib_ldf_mode = deep+
upload_speed = 921600

board_build.partitions = partitions_ota.csv

; Cada flag va entre comillas simples porque el SSID puede tener espacios: sin
; eso, `Ire y Mau IoT` se parte en cuatro argumentos y el build falla.
build_flags =
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DMQTT_USER="${secrets.mqtt_user}"'
    '-DMQTT_PASSWORD="${secrets.mqtt_password}"'
    '-DOTA_PASSWORD="${secrets.ota_password}"'

lib_deps =
    knolleary/PubSubClient             @ ^2.8
    adafruit/Adafruit BMP085 Library   @ ^1.2.4
    adafruit/Adafruit SHT31 Library    @ ^2.2.2
    bblanchon/ArduinoJson              @ ^7.0.0
    adafruit/Adafruit Unified Sensor   @ ^1.1.15
    adafruit/Adafruit INA219           @ ^1.2.1
    paulstoffregen/OneWire             @ ^2.3.8
    milesburton/DallasTemperature      @ ^3.11.0
    adafruit/DHT sensor library        @ ^1.4.6

monitor_speed  = 115200
monitor_filters =
    time
    esp32_exception_decoder

; ─── Producción (sin logs, tamaño mínimo) ─────────────────────────────────────
[env:production]
extends = env:base
; `extends` PISA build_flags, no lo acumula: sin la primera línea se perderían
; las credenciales de env:base y el build fallaría en el #error de config.h.
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_VERSION=\"1.8.0\"
    -DLOG_LEVEL=0

; ─── Desarrollo (logs verbosos, upload por OTA posible) ───────────────────────
[env:development]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_VERSION=\"1.8.0-dev\"
    -DLOG_LEVEL=2

; ─── Upload por OTA (usado desde service mode) ────────────────────────────────
; Dos entornos explícitos a propósito. Antes había un único `ota_upload` que
; extendía `env:development`, así que todo deploy por OTA mandaba el build de
; debug sin que se notara — con LOG_LEVEL=2 el setup() quema 2s fijos en
; `delay(2000)` por cada wake, encima del warmup del DHT22. El campo `firmware`
; de la telemetría es el que delata cuál está corriendo.

; Deploy real a campo. Este es el que va salvo que estés depurando.
[env:ota_production]
extends = env:production
upload_protocol  = espota
upload_port      = weather-station-01.local  ; o IP directa, e.g. 192.168.18.105
upload_flags     = --auth=${secrets.ota_password}

; Debug por OTA: logs verbosos, pero paga los 2s de delay por ciclo.
; No dejarlo en campo más de lo necesario.
[env:ota_development]
extends = env:development
upload_protocol  = espota
upload_port      = weather-station-01.local  ; o IP directa, e.g. 192.168.18.105
upload_flags     = --auth=${secrets.ota_password}