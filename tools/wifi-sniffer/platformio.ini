; Sniffer 802.11 en modo promiscuo — proyecto aparte del firmware del nodo.
;
; Es un proyecto PlatformIO independiente a propósito: corre en OTRA placa (una
; ESP32-S3 de banco, no el nodo en campo), no comparte nada de src/ y no debe
; heredar el secrets.ini del firmware — no necesita credenciales, el modo
; promiscuo escucha sin asociarse a nada.
;
; Uso:
;   cd tools/wifi-sniffer
;   pio run -t upload -t monitor
;
; Si tu placa S3 no es la devkitc-1, cambiá `board`. Lo único que importa es que
; sea un ESP32 con radio 2,4 GHz; el S3 se eligió porque tiene RAM de sobra para
; la cola de tramas.

; ─── Dos entornos, por el puerto USB que uses ─────────────────────────────────
; La DevKitC-1 tiene DOS conectores USB-C y no son intercambiables:
;
;   USB   -> periférico USB nativo del S3 (USB-Serial-JTAG). Un solo cable
;            flashea y monitorea, pero DTR y RTS gobiernan IO0 y EN con lógica
;            propia del periférico: cualquier toque se interpreta como secuencia
;            de arranque. El 2026-07-29 un pulso por RTS dejó la placa en
;            `boot:0x23 (DOWNLOAD)` esperando un flasheo que nunca llegaba, y por
;            eso no imprimía nada. Además se re-enumera en cada reset, así que un
;            monitor abierto de antes queda con un handle muerto.
;   UART  -> puente USB-serie clásico contra UART0. Un COM común y silvestre, sin
;            re-enumeración ni rarezas de strapping. Es el camino aburrido, que
;            para depurar es exactamente lo que se quiere.
;
; Por defecto va `s3_uart`: enchufá el cable en el conector rotulado UART.

[platformio]
default_envs = s3_uart

[env:base]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = time

; Sin lib_deps a propósito. El LED integrado es un WS2812 direccionable, pero no
; hace falta librería: `neopixelWrite()` viene en el core de Arduino-ESP32
; (esp32-hal-rgb-led.h) y genera la trama de color por RMT. Se probó con
; Adafruit NeoPixel agregada y el resultado es idéntico — era peso muerto.

build_flags =
    ; Canal donde está la red. Hoy es el 1; si se vuelve a mover el canal en el
    ; router, hay que cambiarlo acá — el promiscuo escucha uno solo por vez.
    -DSNIFF_CHANNEL=1

; Serial por UART0 -> conector UART. El de arranque.
[env:s3_uart]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Serial por el USB nativo -> conector USB. Sólo si hace falta un cable solo.
[env:s3_usb]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Volcado pcap por el USB nativo, para abrir con Wireshark y desencriptar con el
; PSK. Emite una linea `#P <us> <rssi> <len> <base64>` por trama y se calla el
; resto. Va por el conector USB a proposito: ahi la salida corre a velocidad USB
; y el volcado completo de cada trama no cuesta nada.
[env:s3_pcap]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSNIFF_PCAP=1
