; 802.11 promiscuous-mode sniffer — a project separate from the node's firmware.
;
; It's a standalone PlatformIO project on purpose: it runs on ANOTHER board
; (a bench ESP32-S3, not the field node), shares nothing from src/, and must
; not inherit the firmware's secrets.ini — it needs no credentials,
; promiscuous mode listens without associating to anything.
;
; Usage:
;   cd tools/wifi-sniffer
;   pio run -t upload -t monitor
;
; If your S3 board isn't the devkitc-1, change `board`. The only thing that
; matters is that it's an ESP32 with 2.4 GHz radio; the S3 was picked
; because it has RAM to spare for the frame queue.

; ─── Two environments, depending on which USB port you use ────────────────────
; The DevKitC-1 has TWO USB-C connectors and they are NOT interchangeable:
;
;   USB   -> the S3's native USB peripheral (USB-Serial-JTAG). A single
;            cable flashes and monitors, but DTR and RTS govern IO0 and EN
;            with peripheral-specific logic: any touch gets interpreted as
;            a boot sequence. On 2026-07-29 a pulse over RTS left the board
;            in `boot:0x23 (DOWNLOAD)` waiting for a flash that never came,
;            which is why it printed nothing. It also re-enumerates on
;            every reset, so a monitor left open from before ends up with a
;            dead handle.
;   UART  -> classic USB-to-serial bridge against UART0. An ordinary,
;            garden-variety COM port, with no re-enumeration or strapping
;            quirks. It's the boring path, which for debugging is exactly
;            what you want.
;
; Defaults to `s3_uart`: plug the cable into the connector labeled UART.

[platformio]
default_envs = s3_uart

[env:base]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
monitor_filters = time

; No lib_deps on purpose. The onboard LED is an addressable WS2812, but no
; library is needed: `neopixelWrite()` ships in the Arduino-ESP32 core
; (esp32-hal-rgb-led.h) and generates the color frame over RMT. Tested with
; Adafruit NeoPixel added and the result was identical — it was dead weight.

build_flags =
    ; Channel the network is on. Currently 1; if the router's channel
    ; changes again, update it here — promiscuous mode listens to only one at a time.
    -DSNIFF_CHANNEL=1

; Serial over UART0 -> UART connector. The default one.
[env:s3_uart]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0

; Serial over the native USB -> USB connector. Only if a single cable is needed.
[env:s3_usb]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Pcap dump over the native USB, to open with Wireshark and decrypt with the
; PSK. Emits one `#P <us> <rssi> <len> <base64>` line per frame and stays
; quiet otherwise. Goes over the USB connector on purpose: there the output
; runs at USB speed and dumping every frame in full costs nothing.
[env:s3_pcap]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSNIFF_PCAP=1
